<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phd-helper</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0 auto; max-width: 720px; padding: 1rem; display: grid; gap: .75rem; }
  header { display: flex; align-items: center; gap: .75rem; }
  #toggle { padding: .5rem 1rem; border-radius: 8px; border: 1px solid #888; background: transparent; cursor: pointer; font-size: 1rem; }
  #toggle.on { background: #2a7; color: #fff; border-color: #2a7; }
  .meter { height: 8px; background: #4444; border-radius: 4px; flex: 1; overflow: hidden; }
  #meter { height: 100%; width: 0; background: #2a7; transition: width .2s; }
  #transcript { list-style: none; padding: 0; display: grid; gap: .4rem; }
  #transcript li { padding: .5rem .7rem; border-radius: 8px; background: #8881; }
  .composer { display: flex; gap: .5rem; }
  #input { flex: 1; padding: .5rem; border-radius: 8px; border: 1px solid #888; background: transparent; color: inherit; }
  /* Corpus surface (SPEC §6 door 1) */
  .corpus { border-top: 1px solid #8883; padding-top: .75rem; display: grid; gap: .5rem; }
  .corpus h2 { margin: 0; font-size: .9rem; text-transform: uppercase; letter-spacing: .05em; opacity: .7; }
  .upload { display: flex; gap: .5rem; flex-wrap: wrap; }
  .upload input { padding: .4rem; border-radius: 8px; border: 1px solid #888; background: transparent; color: inherit; }
  #corpus-title, #corpus-arxiv { flex: 1; min-width: 8rem; }
  #corpus-docs { list-style: none; padding: 0; margin: 0; display: grid; gap: .35rem; }
  #corpus-docs .doc { padding: .45rem .6rem; border-radius: 8px; background: #8881; display: grid; gap: .2rem; }
  #corpus-docs .row { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
  #corpus-docs .st { font-variant-numeric: tabular-nums; min-width: 6.5rem; }
  #corpus-docs .st.failed { color: #c44; }
  #corpus-docs .st.indexed { color: #2a7; }
  #corpus-docs .ttl { font-weight: 600; }
  #corpus-docs .id { font-weight: 400; opacity: .5; font-size: .8em; }
  #corpus-docs .meta { opacity: .6; font-size: .85em; }
  #corpus-docs .acts { margin-left: auto; display: flex; gap: .35rem; }
  #corpus-docs .err { color: #c44; font-size: .85em; }
  #corpus-docs .empty { opacity: .6; }
</style>
</head>
<body>
<header>
  <button id="toggle">Voice: OFF</button>
  <div class="meter" title="input level"><div id="meter"></div></div>
</header>
<ul id="transcript"></ul>
<div class="composer">
  <input id="input" placeholder="type, or arm voice and talk…">
  <button id="send">Send</button>
</div>
<section class="corpus">
  <h2>Corpus</h2>
  <div class="upload">
    <input id="corpus-file" type="file" accept="application/pdf">
    <input id="corpus-title" placeholder="title (optional)">
    <input id="corpus-arxiv" placeholder="arXiv id (optional)">
    <button id="corpus-upload">Upload</button>
  </div>
  <ul id="corpus-docs"></ul>
</section>
<script src="/static/voice.js"></script>
<script src="/static/corpus.js"></script>
</body>
</html>
